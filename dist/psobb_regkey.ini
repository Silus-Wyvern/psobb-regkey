; psobb_regkey.ini - put this next to psobb_regkey.asi (in patches\).
;
; Comments go on their own lines, never after a value: the plugin may
; rewrite the "mode" line once, and a comment on that line would be lost.

[registry]
; Your key name. The client will keep its settings in
;   HKEY_CURRENT_USER\Software\<vendor>\PSOBB
; instead of the shared HKEY_CURRENT_USER\Software\SonicTeam\PSOBB.
;
; Leave it blank the first time: the plugin then only checks whether it
; recognises your client and writes a report to psobb_regkey.log in the
; game folder. It changes nothing in that mode.
;
; Up to 63 characters on a recognised build (the log says the limit).
; Letters, digits, space, hyphen, underscore and dot. No \ or /.
vendor =

[migration]
; What to do with settings players already have in the shared location.
;   0 = nothing (default). Players start with default settings.
;   2 = copy. Settings are copied; the shared location is left untouched.
;   1 = move. For operators relocating a client already in players' hands.
;       Players are asked first; a backup .reg file is written; only then
;       are the copied settings removed from the shared location.
;
; A new client that has never used the shared location never needs 1.
; Login values are never copied, moved or backed up, in any mode.
;
; Runs once. The plugin sets this back to 0 afterwards, and records that it
; ran in the registry, so setting it back to 1 or 2 does not repeat it.
mode = 0

; Where existing settings are taken from. Normally SonicTeam.
source = SonicTeam
